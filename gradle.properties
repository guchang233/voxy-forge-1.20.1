# Gradle
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080 -Dhttp.nonProxyHosts=localhost|127.0.0.1 -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false
# 网络不稳定时增加重试
org.gradle.internal.publish.checksums.insecure=true
# 显式指定 Java 17 安装路径(mise 管理),禁用自动下载
org.gradle.java.installations.paths=/root/.local/share/mise/installs/java/17.0.2
org.gradle.java.installations.auto-download=false

# Forge / Minecraft (1.20.1)
minecraft_version=1.20.1
forge_version=47.2.0
parchment_version=2023.09.03
parchment_minecraft_version=1.20.1

# Mixin (Forge 1.20.1 自带 Mixin,无需额外依赖)
mixin_extras_version=0.2.0-beta.6

# Mod Properties
mod_version=0.2.18-beta-forge
maven_group=me.cortex
archives_base_name=voxy-forge

# Java
java_version=17


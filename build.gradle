buildscript {
    repositories {
        // 优先使用本地 maven 仓库 (ForgeGradle 及其依赖已通过 curl 预下载到 ~/.m2/repository/,
        // 因为 maven.minecraftforge.net 通过 gradle HTTP client 时偶发连接超时)
        mavenLocal()
        // 用国内镜像替代 maven central,因为沙箱中 gradle 直连 repo.maven.apache.org 偶发超时
        maven { url = 'https://mirrors.huaweicloud.com/repository/maven/' }
        maven { url = 'https://mirrors.cloud.tencent.com/maven/' }
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        // ForgeGradle 6.0.x 在 forge maven 上有完整 jar 但无 plugin marker,
        // 因此用 buildscript classpath 而不是 plugins{} DSL
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
        // MixinGradle 插件,用于生成 Forge 运行期 SRG 映射所需的 refmap
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
// Mixin Gradle 插件需要在 ForgeGradle 应用后应用,因为它依赖 minecraft/patcher 扩展
apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

// Mojang 官方 mappings (Parchment plugin 需要额外的 librarian 依赖,沙箱中无法稳定下载,故用 official)
minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 容器环境(cgroup v2)下 Java 17.0.x 读取 cgroup 时可能 NPE,
            // 禁用容器支持绕过该问题,不影响游戏逻辑
            jvmArgs '-XX:-UseContainerSupport'
            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://mirrors.huaweicloud.com/repository/maven/' }
    maven { url = 'https://mirrors.cloud.tencent.com/maven/' }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    // Parchment mappings 仓库
    maven { url = 'https://maven.parchmentmc.org/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 仅编译期依赖,运行期需要用户自己装 Forge 版的 Sodium/Iris (Rubidium/Embeddium + Oculus)
    // 由于这些 mod 的 1.20.1 内部 API 与源版本完全不同,本移植禁用了所有对它们的直接 mixin 集成

    // 原生库 (RocksDB / LMDB / zstd / Jedis / LZ4 / XZ / SQLite)
    // 使用 Forge 的 JarJar 机制打包到 mod jar 里
    // 注意: Forge JarJar 要求版本范围格式 (Maven range),不能直接用纯版本号
    // 同时用 implementation 保证在编译类路径上,jarJar 保证打包进 jar
    //
    // ⚠️ lwjgl 核心 (org.lwjgl:lwjgl) 不能 jarJar 内嵌: MC 1.20.1 自带 LWJGL 3.3.1,
    //    内嵌会导致 JPMS split package 冲突 (Modules lwjgl and org.lwjgl export package ...)。
    //    只内嵌 MC 不提供的子模块 lwjgl-lmdb 和 lwjgl-zstd。
    //    lwjgl 核心用 compileOnly 保证编译期可用,运行期由 MC 提供。
    compileOnly 'org.lwjgl:lwjgl:3.3.1'
    compileOnly 'org.lwjgl:lwjgl-lmdb:3.3.1'
    compileOnly 'org.lwjgl:lwjgl-zstd:3.3.1'
    // jarJar 打包 lwjgl 子模块,排除 lwjgl 核心传递依赖 (MC 自带,内嵌会导致 split package)
    jarJar(implementation('org.lwjgl:lwjgl-lmdb:[3.3.1,4.0)')) {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        version { strictly '[3.3.1,4.0)'; prefer '3.3.1' }
    }
    jarJar(implementation('org.lwjgl:lwjgl-zstd:[3.3.1,4.0)')) {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        version { strictly '[3.3.1,4.0)'; prefer '3.3.1' }
    }
    jarJar(implementation('org.rocksdb:rocksdbjni:[7.10.2,8.0)')) {
        version { strictly '[7.10.2,8.0)'; prefer '7.10.2' }
    }
    jarJar(implementation('redis.clients:jedis:[5.1.0,6.0)')) {
        version { strictly '[5.1.0,6.0)'; prefer '5.1.0' }
    }
    jarJar(implementation('org.apache.commons:commons-pool2:[2.12.0,3.0)')) {
        version { strictly '[2.12.0,3.0)'; prefer '2.12.0' }
    }
    // lz4-java: Forge 1.20.1 自带 at.yawk.lz4:lz4-java (提供 org.lz4:lz4-java capability),
    // 与 org.lz4:lz4-java 冲突。由于 API 兼容 (都用 net.jpountz.lz4 包),
    // 改用 at.yawk.lz4:lz4-java 避免冲突,并 jarJar 打包运行时。
    jarJar(implementation('at.yawk.lz4:lz4-java:[1.8.1,2.0)')) {
        version { strictly '[1.8.1,2.0)'; prefer '1.8.1' }
    }
    jarJar(implementation('org.tukaani:xz:[1.10,2.0)')) {
        version { strictly '[1.10,2.0)'; prefer '1.10' }
    }
    jarJar(implementation('org.xerial:sqlite-jdbc:[3.42.0.0,4.0)')) {
        version { strictly '[3.42.0.0,4.0)'; prefer '3.42.0.0' }
    }

    // Mixin annotation processor,用于生成 refmap (Forge 1.20.1 运行期 SRG 映射需要)
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 配置 JarJar 内嵌依赖的版本范围
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion '3.3.1'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version       : forge_version,
            forge_version_range : '[47,)',
            loader_version_range: '[47,)',
            mod_version         : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // MixinGradle 会自动把 refmap 打包进 jar。
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.java_version)
    it.options.deprecation = true
}

// ForgeGradle 6 默认禁用 jarJar 任务,需要显式启用以打包内嵌依赖
tasks.named('jarJar').configure {
    enabled = true
    // MixinGradle 默认只把 refmap 添加到 jar 任务,jarJar 任务需要手动包含,
    // 否则 -all.jar 里没有 refmap,运行时 mixin 注入点找不到 SRG 方法名。
    from("${buildDir}/tmp/compileJava/compileJava-refmap.json") {
        rename { 'client.voxy.refmap.json' }
    }
    dependsOn(tasks.compileJava)
}

// Mixin Gradle 插件: 为 Forge 1.20.1 运行时 SRG 映射生成 refmap,
// 否则 mixin 注入点使用开发期 official 映射名,运行时找不到目标方法。
mixin {
    add sourceSets.main, 'client.voxy.refmap.json'
    config 'client.voxy.mixins.json'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : project.archives_base_name,
                'Specification-Vendor'    : 'Cortex',
                'Specification-Version'   : project.mod_version,
                'Implementation-Title'    : project.archives_base_name,
                'Implementation-Version'  : project.mod_version,
                'Implementation-Vendor'   : 'Cortex'
        ])
    }
}

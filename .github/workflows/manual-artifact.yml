name: manual-artifact

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 Release (需要打 tag)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove local JDK path config (CI uses setup-java)
        run: sed -i '/org.gradle.java.installations.paths/d' gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Cache ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/forge_gradle
            build/fg_cache
          key: "${{ runner.os }}-forgegradle-1.20.1-${{ hashFiles('gradle.properties') }}"
          restore-keys: "${{ runner.os }}-forgegradle-1.20.1-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew build --no-daemon

      - name: Upload all jars
        uses: actions/upload-artifact@v4
        with:
          name: voxy-artifacts
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload -all jar (with embedded natives)
        uses: actions/upload-artifact@v4
        with:
          name: voxy-forge-${{ github.run_number }}-all
          path: build/libs/*-all.jar
          if-no-files-found: error

      - name: Create Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.18-beta-forge-${{ github.run_number }}
          name: VOXY Forge 1.20.1 Build ${{ github.run_number }}
          body: |
            # VOXY Forge 1.20.1 自动构建

            从 MC 1.21.7+ (Fabric/Java 25) 移植到 MC 1.20.1 (Forge 47.2.0/Java 17)。

            ## 安装
            1. 安装 Minecraft 1.20.1 + Forge 47.2.0+
            2. **下载 `voxy-forge-*-all.jar`** (含所有原生库,必须用这个版本)
            3. 放入 `.minecraft/mods/` 目录
            4. 推荐安装 Embeddium + Oculus 以获得 Sodium/Iris 兼容

            > ⚠️ 不要下载精简版 jar (不含 -all),会因缺少原生库崩溃。

            ## 构建信息
            - Commit: ${{ github.sha }}
            - 构建号: ${{ github.run_number }}
            - 触发者: ${{ github.actor }}
          files: |
            build/libs/*-all.jar
          draft: false
          prerelease: true
